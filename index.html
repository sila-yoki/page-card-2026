<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>送给妈妈的母亲节祝福</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    body { color: #fff; }

    .screen {
      position: fixed;
      inset: 0;
    }

    #startScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(90, 0, 30, 0.42), rgba(0, 0, 0, 0.96) 68%),
        #000;
      z-index: 20;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    #startScreen.hide {
      opacity: 0;
      visibility: hidden;
    }

    .start-box {
      text-align: center;
      cursor: pointer;
      user-select: none;
      animation: pulseBox 1.8s ease-in-out infinite;
    }

    @keyframes pulseBox {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    .start-title {
      font-size: clamp(34px, 9vw, 58px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 14px rgba(255, 60, 120, 0.95);
      margin-bottom: 22px;
    }

    .envelope {
      position: relative;
      width: min(200px, 50vw);
      height: min(128px, 32vw);
      margin: 0 auto;
      background: linear-gradient(180deg, #f6f0e8, #e9e1d6);
      border-radius: 6px;
      box-shadow: 0 0 34px rgba(255, 120, 170, 0.28);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.26);
    }

    .envelope:before,
    .envelope:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 49%, #d4cabd 50%, transparent 51%);
      opacity: 0.9;
    }

    .envelope:after {
      background: linear-gradient(225deg, transparent 49%, #d4cabd 50%, transparent 51%);
    }

    .heart-icon {
      position: absolute;
      left: 50%;
      top: 53%;
      transform: translate(-50%, -50%);
      font-size: clamp(48px, 11vw, 76px);
      filter: drop-shadow(0 0 12px rgba(255, 110, 160, 0.72));
      animation: heartJump 1.4s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes heartJump {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -58%) scale(1.12); }
    }

    .tip {
      margin-top: 18px;
      color: #ffd2e2;
      font-size: clamp(14px, 3.8vw, 18px);
      opacity: 0.94;
      line-height: 1.6;
    }

    #showScreen {
      background:
        radial-gradient(circle at 50% 42%, rgba(90, 8, 40, 0.28), rgba(0,0,0,0) 42%),
        #000;
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 1;
    }

    #showScreen.show { opacity: 1; }

    #heartCanvas,
    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #floatingTexts {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .floating-text {
      position: absolute;
      white-space: nowrap;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 90, 140, 0.26);
      animation-name: drift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      opacity: 0.76;
    }

    @keyframes drift {
      0% { transform: translate3d(0, 0, 0) scale(0.96); opacity: 0.12; }
      15% { opacity: 0.78; }
      65% { opacity: 0.58; }
      100% { transform: translate3d(-18px, -34px, 0) scale(1.03); opacity: 0.08; }
    }

    .center-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 22px;
      z-index: 5;
    }

    .center-card {
      width: min(620px, 88vw);
      padding: 22px 18px;
      border-radius: 28px;
      text-align: center;
      background: radial-gradient(circle at top, rgba(255,255,255,0.12), rgba(255,255,255,0.035));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 0 38px rgba(255, 88, 148, 0.16);
      backdrop-filter: blur(2px);
    }

    .center-message {
      color: #ffd0df;
      font-size: clamp(25px, 7vw, 56px);
      font-weight: 800;
      text-shadow:
        0 0 16px rgba(255, 90, 150, 0.36),
        0 0 34px rgba(255, 90, 150, 0.22);
      line-height: 1.35;
      animation: glow 2.2s ease-in-out infinite;
    }

    .center-sub {
      margin-top: 12px;
      font-size: clamp(15px, 4.1vw, 22px);
      color: rgba(255, 235, 242, 0.96);
      font-weight: 500;
      line-height: 1.65;
    }

    @keyframes glow {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.028); opacity: 1; }
    }

    .music-btn, .restart-btn {
      position: fixed;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.10);
      color: #fff;
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    .music-btn { top: 16px; right: 16px; }
    .restart-btn { bottom: 16px; right: 16px; }

    .corner-note {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      color: rgba(255,255,255,0.70);
      font-size: 12px;
      line-height: 1.6;
      max-width: 52vw;
    }

    .heart-pulse {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ff5f9b;
      transform: rotate(45deg);
      opacity: 0.68;
      animation: rise 8s linear infinite;
      pointer-events: none;
      filter: blur(0.2px);
      z-index: 3;
    }

    .heart-pulse::before, .heart-pulse::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: inherit;
      border-radius: 50%;
    }

    .heart-pulse::before { left: -7px; top: 0; }
    .heart-pulse::after { left: 0; top: -7px; }

    @keyframes rise {
      0% {
        transform: translateY(24px) rotate(45deg) scale(0.6);
        opacity: 0;
      }
      10% { opacity: 0.72; }
      100% {
        transform: translateY(-110vh) rotate(45deg) scale(1.2);
        opacity: 0;
      }
    }

    /* 手机端：减少文字数量感、留出中心视觉空间 */
    @media (max-width: 640px) {
      .center-wrap {
        align-items: center;
        padding: 20px;
      }

      .center-card {
        width: 86vw;
        padding: 18px 14px;
        background: radial-gradient(circle at top, rgba(35, 0, 16, 0.46), rgba(0, 0, 0, 0.08));
        box-shadow: 0 0 30px rgba(255, 88, 148, 0.14);
      }

      .center-message {
        font-size: clamp(24px, 8vw, 34px);
      }

      .center-sub {
        margin-top: 10px;
        font-size: clamp(14px, 4vw, 17px);
        line-height: 1.75;
      }

      .floating-text {
        opacity: 0.48;
        font-weight: 600;
        text-shadow: 0 0 8px rgba(255, 90, 140, 0.18);
      }

      .music-btn {
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        font-size: 12px;
        padding: 8px 12px;
      }

      .restart-btn {
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        font-size: 12px;
        padding: 8px 12px;
      }

      .corner-note {
        left: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        max-width: 48vw;
        font-size: 11px;
        opacity: 0.68;
      }
    }
  </style>
</head>
<body>
  <audio id="bgm" src="mothers_day_original_bgm.mp3" loop preload="auto"></audio>

  <div id="startScreen" class="screen">
    <div class="start-box" id="startTrigger">
      <div class="start-title">❤️ 点开 ❤️</div>
      <div class="envelope">
        <div class="heart-icon">💗</div>
      </div>
      <div class="tip">点击开启祝福动画和背景音乐</div>
    </div>
  </div>

  <div id="showScreen" class="screen">
    <canvas id="heartCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>
    <div id="floatingTexts"></div>

    <div class="center-wrap">
      <div class="center-card">
        <div class="center-message">
          妈妈，母亲节快乐❤️
          <div class="center-sub">愿您平安喜乐，健康幸福<br>愿所有美好都围绕着您</div>
        </div>
      </div>
    </div>
  </div>

  <button id="musicBtn" class="music-btn">🔊 音乐开启</button>
  <button id="restartBtn" class="restart-btn">💌 再看一次</button>
  <div class="corner-note">给妈妈的一份小惊喜</div>

  <script>
    const startScreen = document.getElementById('startScreen');
    const showScreen = document.getElementById('showScreen');
    const startTrigger = document.getElementById('startTrigger');
    const floatingTexts = document.getElementById('floatingTexts');
    const musicBtn = document.getElementById('musicBtn');
    const restartBtn = document.getElementById('restartBtn');
    const heartCanvas = document.getElementById('heartCanvas');
    const particleCanvas = document.getElementById('particleCanvas');
    const heartCtx = heartCanvas.getContext('2d');
    const pCtx = particleCanvas.getContext('2d');
    const bgm = document.getElementById('bgm');

    let started = false;
    let musicOn = true;
    let heartPoints = [];
    let sparks = [];
    let pulseHeartsCreated = false;
    let animationStarted = false;

    bgm.volume = 0.56;

    function isMobile() {
      return window.innerWidth <= 640;
    }

    function resizeCanvas() {
      heartCanvas.width = window.innerWidth;
      heartCanvas.height = window.innerHeight;
      particleCanvas.width = window.innerWidth;
      particleCanvas.height = window.innerHeight;
      buildHeartPoints();
    }

    function buildHeartPoints() {
      const points = [];
      const scaleBase = isMobile() ? 0.0165 : 0.018;
      const scale = Math.min(window.innerWidth, window.innerHeight) * scaleBase;
      for (let t = 0; t < Math.PI * 2; t += 0.03) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        points.push({ x: x * scale, y: -y * scale });
      }
      heartPoints = points;
    }

    function createFloatingTexts() {
      floatingTexts.innerHTML = '';
      const phrases = isMobile()
        ? ["妈妈我爱您❤️", "母亲节快乐❤️", "平安喜乐❤️", "健康幸福❤️", "谢谢妈妈❤️"]
        : ["妈妈我爱您❤️", "母亲节快乐❤️", "愿您平安喜乐❤️", "愿您健康幸福❤️", "谢谢妈妈❤️", "永远爱您❤️", "妈妈辛苦了❤️", "愿您每天开心❤️"];

      const colors = ['#ffd2de', '#f7b8ce', '#e9c39a', '#b7d8ff', '#ffc1ea', '#f0d8b4'];
      const count = isMobile() ? 12 : 42;

      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'floating-text';
        span.textContent = phrases[Math.floor(Math.random() * phrases.length)];

        // 手机端尽量避开正中间，不挡住主标题
        if (isMobile()) {
          const side = Math.random();
          span.style.left = (side < 0.5 ? Math.random() * 18 : 72 + Math.random() * 22) + 'vw';
          span.style.top = (8 + Math.random() * 82) + 'vh';
          span.style.fontSize = (12 + Math.random() * 6) + 'px';
        } else {
          span.style.left = Math.random() * 96 + 'vw';
          span.style.top = Math.random() * 96 + 'vh';
          span.style.fontSize = (14 + Math.random() * 18) + 'px';
        }

        span.style.color = colors[Math.floor(Math.random() * colors.length)];
        span.style.animationDuration = (9 + Math.random() * 14) + 's';
        span.style.animationDelay = (-Math.random() * 12) + 's';
        floatingTexts.appendChild(span);
      }
    }

    function createPulseHearts() {
      if (pulseHeartsCreated) return;
      pulseHeartsCreated = true;
      const heartCount = isMobile() ? 12 : 24;

      for (let i = 0; i < heartCount; i++) {
        const item = document.createElement('div');
        item.className = 'heart-pulse';
        item.style.left = (Math.random() * 100) + 'vw';
        item.style.bottom = (-10 - Math.random() * 30) + 'px';
        item.style.animationDuration = (7 + Math.random() * 7) + 's';
        item.style.animationDelay = (-Math.random() * 10) + 's';
        item.style.opacity = 0.28 + Math.random() * 0.28;
        item.style.background = ['#ff6da9', '#ff8fbf', '#ff5e93'][Math.floor(Math.random() * 3)];

        if (isMobile()) {
          item.style.width = '10px';
          item.style.height = '10px';
        }

        document.body.appendChild(item);
      }
    }

    function initSparks() {
      sparks = [];
      const total = isMobile() ? 90 : 190;
      for (let i = 0; i < total; i++) {
        sparks.push({
          t: Math.random() * Math.PI * 2,
          offset: Math.random(),
          size: isMobile() ? 1.6 + Math.random() * 2.4 : 2 + Math.random() * 4,
          alpha: 0.28 + Math.random() * 0.48
        });
      }
    }

    function animateHeart() {
      heartCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);
      const cx = heartCanvas.width / 2;
      const cy = heartCanvas.height / 2;
      const pulse = 1 + Math.sin(Date.now() / 500) * 0.045;

      heartCtx.save();
      heartCtx.translate(cx, cy);

      for (let i = 0; i < heartPoints.length; i++) {
        const p = heartPoints[i];
        const x = p.x * pulse;
        const y = p.y * pulse;
        const glow = (isMobile() ? 1.0 : 1.5) + (Math.sin(Date.now() / 300 + i * 0.15) + 1) * (isMobile() ? 0.8 : 1.3);
        heartCtx.beginPath();
        heartCtx.fillStyle = `rgba(255, 152, 192, ${isMobile() ? 0.26 : 0.35})`;
        heartCtx.arc(x, y, glow + 2, 0, Math.PI * 2);
        heartCtx.fill();
      }

      for (let i = 0; i < sparks.length; i++) {
        const s = sparks[i];
        s.t += 0.008;
        const base = heartPoints[Math.floor((i / sparks.length) * heartPoints.length)];
        const fx = base.x * pulse + Math.sin(s.t * 2 + s.offset * 10) * (isMobile() ? 10 : 18);
        const fy = base.y * pulse + Math.cos(s.t * 2 + s.offset * 10) * (isMobile() ? 10 : 18);
        heartCtx.beginPath();
        heartCtx.fillStyle = `rgba(255, 104, 162, ${s.alpha})`;
        heartCtx.arc(fx, fy, s.size, 0, Math.PI * 2);
        heartCtx.fill();
      }

      heartCtx.restore();
      requestAnimationFrame(animateHeart);
    }

    const particlePool = [];
    function createParticle() {
      const angle = Math.random() * Math.PI * 2;
      const radius = 20 + Math.random() * (isMobile() ? 60 : 90);
      return {
        x: particleCanvas.width / 2 + Math.cos(angle) * radius,
        y: particleCanvas.height / 2 + Math.sin(angle) * radius,
        vx: (Math.random() - 0.5) * 0.38,
        vy: -0.18 - Math.random() * 0.65,
        size: isMobile() ? 0.8 + Math.random() * 2 : 1 + Math.random() * 3,
        life: 70 + Math.random() * 70,
        alpha: 0.20 + Math.random() * 0.45,
        color: ['255,160,200', '255,120,170', '255,210,230'][Math.floor(Math.random() * 3)]
      };
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
      const maxParticles = isMobile() ? 70 : 120;
      if (particlePool.length < maxParticles) {
        particlePool.push(createParticle());
      }

      for (let i = particlePool.length - 1; i >= 0; i--) {
        const p = particlePool[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        p.alpha *= 0.995;

        pCtx.beginPath();
        pCtx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fill();

        if (p.life <= 0 || p.y < -20) {
          particlePool.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }

    function startAnimationsOnce() {
      if (animationStarted) return;
      animationStarted = true;
      animateHeart();
      animateParticles();
    }

    async function playMusic() {
      try {
        await bgm.play();
        musicOn = true;
        musicBtn.textContent = '🔊 音乐开启';
      } catch (error) {
        musicOn = false;
        musicBtn.textContent = '🔇 点我开音乐';
      }
    }

    function pauseMusic() {
      bgm.pause();
      musicOn = false;
      musicBtn.textContent = '🔇 音乐关闭';
    }

    function startShow() {
      if (started) return;
      started = true;
      resizeCanvas();
      createFloatingTexts();
      createPulseHearts();
      initSparks();
      startAnimationsOnce();
      startScreen.classList.add('hide');
      showScreen.classList.add('show');
      bgm.currentTime = 0;
      playMusic();
    }

    startTrigger.addEventListener('click', startShow);

    musicBtn.addEventListener('click', () => {
      if (musicOn && !bgm.paused) {
        pauseMusic();
      } else {
        playMusic();
      }
    });

    restartBtn.addEventListener('click', () => {
      startScreen.classList.remove('hide');
      showScreen.classList.remove('show');
      started = false;
      pauseMusic();
      bgm.currentTime = 0;
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      createFloatingTexts();
      initSparks();
    });

    resizeCanvas();
    createFloatingTexts();
  </script>
